[workspace]
resolver = "3"
members = ["crates/core", "crates/relay", "crates/host", "crates/client", "crates/wasm", "crates/e2e"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
dsbot-link-core = { path = "crates/core" }
dsbot-link-relay = { path = "crates/relay", default-features = false }
dsbot-link-host = { path = "crates/host" }
dsbot-link-client = { path = "crates/client", default-features = false }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", features = ["ws"] }
wasm-bindgen = "=0.2.130"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
