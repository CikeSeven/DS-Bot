[package]
name = "dsbot-link-relay"
description = "The DS Bot phone link's Relay Server: a sans-IO core and a tokio + axum runtime around it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["server"]
server = ["dep:tokio", "dep:axum", "dep:futures-util", "dep:tracing", "dep:tracing-subscriber", "dep:url"]

[dependencies]
dsbot-link-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[[bin]]
name = "dsbot-link-relay"
path = "src/main.rs"
required-features = ["server"]

[[test]]
name = "server"
required-features = ["server"]
